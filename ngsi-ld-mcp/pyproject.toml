[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ngsi-ld-mcp"
version = "0.1.0"
description = "MCP server for NGSI-LD context brokers (FIWARE Orion-LD) with a human approval gate on every write"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "The Mishakin Group" }]
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.optional-dependencies]
http = ["fastapi>=0.110", "uvicorn"]
test = ["pytest", "pytest-asyncio", "fastapi"]

[project.scripts]
ngsi-ld-mcp = "ngsi_ld_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ngsi_ld_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
